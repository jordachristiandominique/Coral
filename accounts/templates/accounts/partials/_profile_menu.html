{% load static %}
<div class="nav-actions">
    <button class="nav-bell" type="button" aria-label="Notifications" title="Notifications">
        <svg class="nav-bell-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" />
            <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" />
        </svg>
    </button>

    <div class="profile-menu" data-profile-menu>
        <button class="profile-trigger" type="button" aria-haspopup="true" aria-expanded="false"
            aria-label="Open profile menu" title="Profile menu" data-profile-trigger>
            {% if user.profile_photo %}
            <img class="profile-avatar-img" src="{{ user.profile_photo.url }}" alt="Profile photo">
            {% else %}
            <span class="profile-avatar" aria-hidden="true">{{ user.first_name|default:user.username|slice:":1"|upper }}</span>
            {% endif %}
            <svg class="profile-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m6 9 6 6 6-6" />
            </svg>
        </button>
        <div class="profile-dropdown" role="menu" aria-label="Profile menu" aria-hidden="true"
            data-profile-dropdown>
            <div class="profile-dropdown-head">
                <span class="profile-dropdown-name">{{ user.get_full_name|default:user.username }}</span>
                <span class="profile-dropdown-role">{{ user.get_role_display }}</span>
            </div>
            <div class="profile-dropdown-divider" role="separator" aria-hidden="true"></div>
            <a href="{% url 'account_settings' %}" class="profile-dropdown-item" role="menuitem">
                <img src="{% static 'icons/setting.png' %}" alt="" aria-hidden="true" class="menu-icon">
                <span>Settings</span>
            </a>
            <a href="{% url 'logout' %}" class="profile-dropdown-item profile-dropdown-item-danger"
                role="menuitem" data-logout-link>
                <img src="{% static 'icons/logout.png' %}" alt="" aria-hidden="true" class="menu-icon">
                <span>Sign Out</span>
            </a>
        </div>
    </div>
</div>
