<details class="repository-actions-menu">
    <summary aria-label="More actions for {{ batch.name }}" title="More actions">
        <i data-lucide="ellipsis-vertical" aria-hidden="true"></i>
    </summary>
    <div class="repository-menu-popover">
        <form method="post" action="{% url 'batch_map_visibility' batch.id %}" class="repository-map-visibility-form">
            {% csrf_token %}
            <input type="hidden" name="return_to" value="{{ batch_type }}">
            {% if batch.is_map_visible %}
            <input type="hidden" name="is_map_visible" value="false">
            <button type="submit"><i data-lucide="eye-off" aria-hidden="true"></i>Hide from map</button>
            {% else %}
            <input type="hidden" name="is_map_visible" value="true">
            <button type="submit"><i data-lucide="eye" aria-hidden="true"></i>Show on map</button>
            {% endif %}
        </form>
        <form method="post" action="{% url 'batch_delete' batch.id %}" class="repository-delete-form" data-trash-action="move"
            data-repository-name="{{ batch.name }}">
            {% csrf_token %}
            <input type="hidden" name="return_to" value="{{ batch_type }}">
            <button type="submit"><i data-lucide="trash-2" aria-hidden="true"></i>Move to trash</button>
        </form>
    </div>
</details>
